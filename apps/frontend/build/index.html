<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Homematic Channel Config</title>
  <style>
    :root {
      --bg: transparent;
      --text: #1a2233;
      --text-muted: #4a5a78;
      --border: #cfd6e4;
      --input-bg: #fff;
      --btn-secondary-bg: #e8ecf4;
      --btn-secondary-text: #1a2233;
      --status: #4a5a78;
      --status-error: #c0392b;
      --status-success: #27ae60;
      --status-warning: #d68910;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #e6edf3;
        --text-muted: #8b949e;
        --border: #30363d;
        --input-bg: #21262d;
        --btn-secondary-bg: #21262d;
        --btn-secondary-text: #e6edf3;
        --status: #8b949e;
        --status-error: #f85149;
        --status-success: #3fb950;
        --status-warning: #d29922;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: Segoe UI, sans-serif; font-size: 14px; }
    .container { padding: 16px 20px; }
    h1 { margin: 0 0 4px; font-size: 18px; }
    .subtitle { margin: 0 0 20px; color: var(--text-muted); font-size: 13px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    select { border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font-size: 14px; background: var(--input-bg); color: var(--text); }
    .checkbox-row { display: flex; align-items: center; gap: 10px; padding: 2px 0; }
    .checkbox-row input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; flex-shrink: 0; }
    .note { font-size: 12px; color: var(--text-muted); margin: -8px 0 16px; }
    .actions { display: flex; gap: 10px; align-items: center; margin-top: 20px; }
    button { border: 0; border-radius: 6px; background: #1f6feb; color: #fff; padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    .btn-secondary { background: var(--btn-secondary-bg); color: var(--btn-secondary-text); }
    .status { font-size: 13px; color: var(--status); }
    .status.error { color: var(--status-error); }
    .status.success { color: var(--status-success); }
    .status.warning { color: var(--status-warning); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="title">Loading…</h1>
    <p class="subtitle" id="subtitle"></p>

    <div id="field-switchMatterType" class="field hidden">
      <label for="input-switchMatterType">Matter device type</label>
      <select id="input-switchMatterType">
        <option value="light">Light (on/off)</option>
        <option value="outlet">Outlet (on/off)</option>
        <option value="switch">Generic switch (on/off)</option>
        <option value="fan">Fan (on/off)</option>
      </select>
    </div>

    <div id="field-exposeHumidity" class="field hidden">
      <label>Humidity sensor</label>
      <div class="checkbox-row">
        <input id="input-exposeHumidity" type="checkbox" />
        <span>Expose humidity (adds RelativeHumidityMeasurement to the thermostat endpoint)</span>
      </div>
    </div>

    <div id="field-exposeBrightness" class="field hidden">
      <label>Brightness sensor</label>
      <div class="checkbox-row">
        <input id="input-exposeBrightness" type="checkbox" />
        <span>Expose brightness (adds IlluminanceMeasurement to the motion detector endpoint)</span>
      </div>
    </div>

    <p id="note" class="note hidden"></p>

    <div class="actions">
      <button id="btn-save" type="button" disabled>Save</button>
      <button id="btn-reset" type="button" class="btn-secondary">Reset to default</button>
      <span id="status" class="status"></span>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
